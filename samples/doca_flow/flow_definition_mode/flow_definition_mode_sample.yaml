number_of_ports: 2
mode_args:
  - vnf
ports_description:
  port_0: doca_dev
  port_1: doca_dev
description: >-
  Demonstrates flat Definition Mode with a four-byte IPv4 destination match and a four-byte IPv4
  source rewrite action. Build the installed sample with "meson /tmp/flow_definition_mode_build &&
  ninja -C /tmp/flow_definition_mode_build" and run
  "/tmp/flow_definition_mode_build/doca_flow_definition_mode -- -a <port0>,dv_flow_en=2 -a
  <port1>,dv_flow_en=2".
use_cases:
  - name: "Compact IPv4 match and rewrite"
    args: ""
    stages:
      - name: "Forward and rewrite matching IPv4 packets"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IP(src='10.0.0.1', dst='8.8.8.8')/UDP(sport=1000, dport=2000)/Raw(load=b'flat mode port 0 payload')
          - receiving_port: 1
            packets:
              - Ether()/IP(src='10.0.0.2', dst='8.8.8.8')/UDP(sport=1001, dport=2001)/Raw(load=b'flat mode port 1 payload')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 0
                packets:
                  - Ether()/IP(src='192.0.2.1', dst='8.8.8.8')/UDP(sport=1001, dport=2001)/Raw(load=b'flat mode port 1 payload')
              - forwarding_port: 1
                packets:
                  - Ether()/IP(src='192.0.2.1', dst='8.8.8.8')/UDP(sport=1000, dport=2000)/Raw(load=b'flat mode port 0 payload')
