number_of_ports: 2
min_supported_nic:
  - ConnectX-9
mode_args:
  - vnf
ports_description:
  port_0: doca_dev
  port_1: doca_dev
description: "This sample shows how to use the DOCA Flow memory external action with a
              selectable operation (--operation). It creates a 16-entry 64-bit external memory and
              seeds slot i with a distinct 64-bit value (0x1122334455667700 + i), then builds a
              classifier -> memory ordered-list -> egress pipeline on port 0. The classifier
              copies the packet source IP into the high 32 bits and destination IP into the low
              32 bits of a metadata register pair (the input for STORE/ADD/XOR/OR/AND); the
              selected memory operation acts on the addressed slot and leaves its return value
              (defined per-operation - see doca_flow_external_action_memory_operation) in the
              register pair. Both modes select the slot per packet from the low
              log2(num_resources) bits of the L4 source port: by default the classifier matches
              the port and forwards to a per-slot memory entry, while --use-access-index copies
              the port into the access_index register instead. The egress pipe writes the
              operation's return value back onto the packet, so a forwarded IPv4 packet leaves
              port 1 carrying that value. The injected packet uses L4 source port 1234, which
              selects slot 2 (1234 & 0xf), seeded 0x1122334455667702. For the first packet of a
              fresh run, LOAD/STORE/ADD/XOR/OR/AND all return the same value (the seed) since
              there is no prior operation on the slot to distinguish them; FFS_ID_MSB/LSB and
              FIND_FIRST_SET_AND_RESET_ID_MSB/LSB return the found bit's index (from LSB, see the
              programming guide for the exact register layout); FFS_SET_BITMAP_MSB/LSB and
              FIND_FIRST_SET_AND_RESET_BITMAP_MSB/LSB return a one-hot bitmask of the found bit.
              The memory is read back through the host read API before and after so the 64-bit
              effect is observable.
              Sample Command Line: ./build/doca_flow_memory_external_action -- -a pci/08:00.0 -a pci/08:00.1 --operation add"
use_cases:
  - name: "Memory external action LOAD"
    args: "--operation load"
    stages:
      - name: "Sending packets iteration 1"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether(src='aa:bb:cc:dd:ee:ff')/IP(src='1.1.1.1', dst='2.2.2.2')/UDP(sport=1234, dport=80)/Raw(load=b'memory external action LOAD sample')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether(src='aa:bb:cc:dd:ee:ff')/IP(src='17.34.51.68', dst='85.102.119.2')/UDP(sport=1234, dport=80)/Raw(load=b'memory external action LOAD sample')
