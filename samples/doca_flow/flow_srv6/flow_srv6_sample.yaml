number_of_ports: 3
min_supported_nic:
  - ConnectX-7
mode_args:
  - switch
fw_config:
  FLEX_PARSER_PROFILE:
    - 4
  PROG_PARSE_GRAPH:
    - 1
ports_description:
  port_0: doca_dev
  port_1: doca_rep_dev
  port_2: doca_rep_dev
description: "This sample demonstrates SRv6 SRH push (first segment) and decrement (on intermediate segment),
              control pipe classification, and IPv6 DIP copy from the active segment.
              Topology: PF0 plus two representors (VF0, VF1). All test packets ingress on PF0.
              Plain IPv6 is forwarded to VF0 after PUSH; SRH with segments_left > 0 is decremented and
              forwarded to VF1; SRH with segments_left == 0 has SRH popped in HW then delivered to RSS.
              SRH layers use nh=6 so the next protocol after the routing header is TCP (required for valid Scapy builds).
              NOTE: On ConnectX-7, the '-s partial' argument is required because the device does not support
              FIELD offset mode for SID copy. Without it the sample will fail during pipe creation.
              Sample Command Line: ./build/doca_flow_srv6 -- -l 60 -r pci/08:00.0,pf0sf[0-1]"
use_cases:
  - name: "Flow SRv6 PUSH - plain IPv6 (no SRH)"
    args: ""
    stages:
      - name: "Plain IPv6 on PF0 -> PUSH SRH + copy SID to DIP -> VF0"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="fc00::1", nh=6)/TCP(dport=80)/Raw(load=b'Plain IPv6 - should get SRH pushed')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether()/IPv6(dst="2001:db8:0:2::2", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=1, addresses=["2001:db8:0:1::1","2001:db8:0:2::2"])/TCP(dport=80)/Raw(load=b'Plain IPv6 - should get SRH pushed')
  - name: "Flow SRv6 DECREMENT - SRH with segments_left > 0"
    args: ""
    stages:
      - name: "IPv6 with SRH segments_left=1 on PF0 -> decrement + copy SID to DIP -> VF1"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="2001:db8:a::7", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=1, addresses=["2001:db8:a::1","2001:db8:b::2"])/TCP(dport=80)/Raw(load=b'SRH seg_left=1 - decrement and copy')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 2
                packets:
                  - Ether()/IPv6(dst="2001:db8:a::1", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=0, addresses=["2001:db8:a::1","2001:db8:b::2"])/TCP(dport=80)/Raw(load=b'SRH seg_left=1 - decrement and copy')
  - name: "Flow SRv6 POP - SRH with segments_left == 0 (RSS)"
    args: ""
    stages:
      - name: "IPv6 with SRH segments_left=0 on PF0 -> HW POP -> RSS"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="2001:db8:c::3", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=0, addresses=["2001:db8:c::3","2001:db8:d::4"])/TCP(dport=80)/Raw(load=b'SRH seg_left=0 - pop SRH')
        # POP is performed in HW then RSS delivered to the application.
        # No packet emerges on a representor port, so expected_packets is empty.
        validation:
          - type: packet
            expected_packets: []
  - name: "Flow SRv6 partial mode PUSH - plain IPv6 (no SID copy)"
    args: "-s partial"
    stages:
      - name: "Plain IPv6 on PF0 -> PUSH SRH (no SID copy) -> VF0"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="fc00::1", nh=6)/TCP(dport=80)/Raw(load=b'Partial mode - SRH pushed without SID copy')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether()/IPv6(dst="fc00::1", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=1, addresses=["2001:db8:0:1::1","2001:db8:0:2::2"])/TCP(dport=80)/Raw(load=b'Partial mode - SRH pushed without SID copy')
  - name: "Flow SRv6 partial mode DECREMENT - SRH with segments_left > 0 (no SID copy)"
    args: "-s partial"
    stages:
      - name: "IPv6 with SRH segments_left=1 on PF0 -> decrement only (no SID copy) -> VF1"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="2001:db8:a::7", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=1, addresses=["2001:db8:a::1","2001:db8:b::2"])/TCP(dport=80)/Raw(load=b'Partial mode - decrement only')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 2
                packets:
                  - Ether()/IPv6(dst="2001:db8:a::7", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=0, addresses=["2001:db8:a::1","2001:db8:b::2"])/TCP(dport=80)/Raw(load=b'Partial mode - decrement only')
  - name: "Flow SRv6 partial mode POP - SRH with segments_left == 0 (RSS)"
    args: "-s partial"
    stages:
      - name: "IPv6 with SRH segments_left=0 on PF0 -> HW POP -> RSS"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IPv6(dst="2001:db8:c::3", nh=43)/IPv6ExtHdrSegmentRouting(type=4, nh=6, segleft=0, addresses=["2001:db8:c::3","2001:db8:d::4"])/TCP(dport=80)/Raw(load=b'Partial mode - pop SRH')
        validation:
          - type: packet
            expected_packets: []
