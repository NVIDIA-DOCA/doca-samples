number_of_ports: 2
min_supported_nic:
  - ConnectX-10
mode_args:
  - vnf
ports_description:
  port_0: doca_dev
  port_1: doca_dev
description: "This sample demonstrates the DOCA Flow mutex external action in VNF mode.
              Two source IPs are pinned to distinct scratchpad values by a basic pipe and then run a
              read-modify-write sequence (STORE/ADD/LOAD) against one shared ASO-memory slot inside an
              ordered-list pipe. By default the sequence is wrapped in MUTEX LOCK/UNLOCK so the hardware
              serialises the two flows; --no-mutex drops the fences to demonstrate the interleaving that
              the mutex prevents. The post-RMW value is copied into meta.pkt_meta and read back on the host
              via RTE_FLOW_DYNF_METADATA by one RX thread per RSS queue.
              Correctness is decided by the host-side counters rather than by forwarded packets: the run
              fails when no packet arrives, when a packet carries no usable metadata, or when mutex mode
              observes any anomaly.
              Sample Command Line: ./build/doca_flow_external_action_mutex -- -a aux/2,dv_flow_en=2 -a aux/3,dv_flow_en=2 -l 60 --duration 10"
use_cases:
  - name: "Flow external action mutex use case"
    args: ""
    stages:
      - name: "Sending one packet per source IP"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Flow A, scratchpad value 1, post-RMW value 2')
              - Ether()/IP(src='5.6.7.8', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Flow B, scratchpad value 10, post-RMW value 20')
        validation:
          - type: dump
            expected_text:
              - "Pipeline built (with-mutex)"
              - "Summary (use_mutex=true)"
              - "total_anomalies=0"
              - "total_no_metadata=0"
  - name: "Flow external action mutex use case, mutex disabled"
    args: "--no-mutex"
    stages:
      - name: "Sending one packet per source IP"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Flow A, scratchpad value 1, post-RMW value 2')
              - Ether()/IP(src='5.6.7.8', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Flow B, scratchpad value 10, post-RMW value 20')
        validation:
          - type: dump
            expected_text:
              - "Pipeline built (no-mutex)"
              - "Summary (use_mutex=false)"
              - "total_no_metadata=0"
