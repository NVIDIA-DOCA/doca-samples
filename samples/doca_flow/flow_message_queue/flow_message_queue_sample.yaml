number_of_ports: 1
min_supported_nic:
  - ConnectX-9
mode_args:
  - vnf
fw_config:
  FLEX_PARSER_PROFILE:
    - 10
ports_description:
  port_0: doca_dev
description: "This sample illustrates the DOCA Flow message queue in VNF mode.
              It registers a two-field message format ('key', 'seq') as a programmable struct, binds a message type to it,
              and starts the port with one message queue and a completion callback.
              A MESSAGE-isolation classify pipe matches on 'key', SETs 'seq' to a constant, copies 'key' into pkt_meta with an action descriptor,
              and forwards to a MESSAGE-isolation verdict pipe keyed on both written values, which drops as the isolation rules require.
              The sample then attaches the message type to the classify pipe and injects hitting messages (buffered) and missing ones (unbuffered),
              polls the completions, and reports the queue completion stats next to the two entry counters.
              The sample sends no wire traffic: all messages originate in software, so the whole run is self-contained and needs no injected packets.
              Root privileges are required for the message queue's DevX objects.
              Sample Command Line: sudo ./build/doca_flow_message_queue -- -a aux/2,dv_flow_en=2 -l 60"
use_cases:
  - name: "Flow message queue use case"
    args: ""
    stages:
      # The sample injects its own messages, so the stage sends no packets and the
      # message queue stats and entry counters the sample logs are the observables.
      - name: "Validating the messages injected from software"
        validation:
          - type: dump
            expected_text:
              - "Message queue 0: 6 completed, 0 failed"
              - "Messages that matched the classify key: 4 messages"
              - "Messages that carried the SET seq and the copied pkt_meta: 4 messages"
