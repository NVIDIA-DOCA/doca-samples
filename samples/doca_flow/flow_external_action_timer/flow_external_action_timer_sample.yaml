number_of_ports: 2
min_supported_nic:
  - ConnectX-10
mode_args:
  - vnf
ports_description:
  port_0: doca_dev
  port_1: doca_dev
description: "This sample demonstrates the DOCA Flow external action timer API in VNF mode.
              An original packet (src=1.2.3.4, dst=8.8.8.8) injected into PF0 starts a hardware timer via the START ordered-list element;
              an ACK with reversed IPs (src=8.8.8.8, dst=1.2.3.4) hits the STOP ordered-list element. Both directions forward to PF1.
              Pipes are programmed only on PF0; traffic injected into PF1 has no matching entry.
              Timer-expiry events fire asynchronously via doca_flow_event_process and are reported via DOCA_LOG_INFO; their validation is out of scope for this YAML harness.
              Sample Command Line: ./build/doca_flow_external_action_timer -- -a aux/2,dv_flow_en=2 -a aux/3,dv_flow_en=2 -l 60"
use_cases:
  - name: "Flow external action timer use case"
    args: ""
    stages:
      - name: "Sending START and STOP packets"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Original packet, starts hardware timer, forwarded to port 1')
              - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='8.8.8.8', dst='1.2.3.4')/TCP(sport=80, dport=1234)/Raw(load=b'ACK packet, stops hardware timer, forwarded to port 1')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Original packet, starts hardware timer, forwarded to port 1')
                  - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='8.8.8.8', dst='1.2.3.4')/TCP(sport=80, dport=1234)/Raw(load=b'ACK packet, stops hardware timer, forwarded to port 1')
  - name: "Flow external action timer expiry use case (START only)"
    args: ""
    stages:
      - name: "Sending START packet only, letting the hardware timer expire"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Original packet, starts hardware timer, forwarded to port 1')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether( dst='00:00:5e:00:01:01', src='9c:63:c0:9c:09:9e')/IP(src='1.2.3.4', dst='8.8.8.8')/TCP(sport=1234, dport=80)/Raw(load=b'Original packet, starts hardware timer, forwarded to port 1')
