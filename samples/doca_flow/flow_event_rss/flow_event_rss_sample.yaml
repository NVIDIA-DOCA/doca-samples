number_of_ports: 2
min_supported_nic:
  - ConnectX-9
mode_args:
  - switch
ports_description:
  port_0: doca_dev
  port_1: doca_rep_dev
description: "Receives VLAN-tagged traffic on the wire port, pops the VLAN tag and forwards the
              packet to the VF representor. Delivers the VLAN TCI to software through shared EVENT_RSS
              (CUSTOM_METADATA CQE) without pulling full packets to the CPU.
              Port 0 = wire (PF), port 1 = VF representor. Run with PF0+VF0 only.
              Sample Command Line: ./build/doca_flow_event_rss -- -l 60 -r pci/08:00.0,pf0vf0"
use_cases:
  - name: "Flow event RSS use case #1"
    args: ""
    stages:
      - name: "Single-VLAN ingress on wire, pop VLAN and forward to representor"
        packets_to_send:
          - receiving_port: 0
            packets:
              - Ether()/Dot1Q(vlan=100)/IP()/TCP()/Raw(load=b'Sent to port 0, VLAN tag removed, forwarded from port 1')
              - Ether()/IP()/UDP()/Raw(load=b'Sent to port 0, non-VLAN packet dropped')
        validation:
          - type: packet
            expected_packets:
              - forwarding_port: 1
                packets:
                  - Ether()/IP()/TCP()/Raw(load=b'Sent to port 0, VLAN tag removed, forwarded from port 1')
          - type: dump
            expected_text:
              - "Port 0 (wire ingress): packets=1"
              - "Port 1 (representor egress): packets=1"
              - "cqe_callback: vlan_tci = 100"
